  <path d="M 170 720 H 1630 M 170 720 V 150" stroke="#222222" stroke-width="7" fill="none"/>
  <path d="M 180 680 C 480 680 650 620 850 505 C 1050 390 1210 245 1570 180" stroke="#2676c9" stroke-width="24" fill="none"/>
  <circle cx="850" cy="505" r="28" fill="#d95f02"/>
